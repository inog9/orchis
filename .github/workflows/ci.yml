name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pi/*.test.mjs
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/pentest-harnes
      - if: runner.os == 'Linux'
        run: go test -race ./...
