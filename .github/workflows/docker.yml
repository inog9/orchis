name: Docker stack smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - docker/**
      - cmd/**
      - internal/**
      - pi-runtime/**
      - skills/**
      - tests/pi/job*.test.mjs
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  unattended-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go build -o "$RUNNER_TEMP/pentest-harnes" ./cmd/pentest-harnes
      - run: npm install --prefix "$RUNNER_TEMP/job-pi" --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.0
      - name: Verify unattended RPC against a local mock model
        env:
          PENTEST_HARNES_TEST_BIN: ${{ runner.temp }}/pentest-harnes
          PENTEST_HARNES_TEST_PI: ${{ runner.temp }}/job-pi/node_modules/.bin/pi
        run: node --test tests/pi/job.test.mjs tests/pi/job-smoke.test.mjs
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t orchis-pentest:ci .
      - name: Verify installed skill tools without external targets
        run: docker run --rm --init orchis-pentest:ci python3 /opt/pentest/docker/tool-smoke.py
      - name: Verify browser, TLS, capture, and discovered chunks
        run: docker run --rm --init --shm-size=1g orchis-pentest:ci python3 /opt/pentest/docker/smoke.py
