# Explicit fixture profile: scanners cannot reach the internet in a smoke run.
services:
  nmap:
    networks: !override [backend]
  nuclei:
    networks: !override [backend]
  fixture:
    image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    command: [node, /fixture/server.mjs]
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [./fixture.mjs:/fixture/server.mjs:ro]
    networks: [backend]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
