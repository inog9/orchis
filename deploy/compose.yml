# Stack pengembangan orchis-go. Hanya mendengarkan di 127.0.0.1.
name: orchisgo-dev
services:
  pg:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: orchis, POSTGRES_PASSWORD: orchis, POSTGRES_DB: orchis }
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U orchis -d orchis"], interval: 3s, timeout: 3s, retries: 20 }
  mq:
    image: rabbitmq:4.4-management
    environment: { RABBITMQ_DEFAULT_USER: orchis, RABBITMQ_DEFAULT_PASS: orchis }
    ports: ["127.0.0.1:15672:5672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 5s, retries: 30 }
    profiles: [full]
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:19200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qE 'green|yellow'"], interval: 5s, timeout: 5s, retries: 40 }
    profiles: [full]
  minio:
    image: pgsty/silo:latest
    environment: { MINIO_ROOT_USER: orchis, MINIO_ROOT_PASSWORD: orchis-dev-secret }
    command: server /data
    ports: ["127.0.0.1:19000:9000"]
    volumes: [s3data:/data]
    profiles: [full]
volumes: { pgdata: {}, esdata: {}, s3data: {} }
