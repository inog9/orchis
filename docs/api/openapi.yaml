        line: 39
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retain the private workspace while its owning execution exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  retained:
                    type: boolean
                required:
                - retained
        '401':
          $ref: '#/components/responses/Problem'
      security:
      - InjectorBearer: []
