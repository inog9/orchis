paths:
  /api/v1/injector/executions/{id}/progress:
    post:
      operationId: post_injector_execution_progress
      summary: Hackbot progress
      description: Authenticated worker metadata only. This does not launch target activity.
      tags:
      - injector
      x-roles:
      - machine
      x-source:
        file: internal/execution/injector_http.go
        line: 48
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Progress recorded
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      security:
      - InjectorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hackbot.Progress'
  /api/v1/injector/executions/{id}/retention:
    post:
